<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人中心 - MyPetStore</title>
  </head>
  <body>
    <div class="site-shell" data-app-shell>
      <main class="main">
        <div class="container">
          <div class="page-head">
            <div>
              <h1>个人中心</h1>
              <p>维护账户资料和登录密码。</p>
            </div>
            <button class="btn btn-danger" type="button" data-logout-page>退出登录</button>
          </div>
          <div class="notice" data-notice></div>
          <div class="user-layout">
            <section class="panel">
              <div class="panel__header"><h2>个人资料</h2></div>
              <form class="panel__body form-grid" data-profile-form></form>
            </section>
            <section class="panel">
              <div class="panel__header"><h2>修改密码</h2></div>
              <form class="panel__body form-grid" data-password-form>
                <label class="form-group form-group--full">
                  <span class="form-label">旧密码</span>
                  <input class="form-control" name="oldPassword" type="password" maxlength="25" required />
                </label>
                <label class="form-group form-group--full">
                  <span class="form-label">新密码</span>
                  <input class="form-control" name="newPassword" type="password" maxlength="25" required />
                </label>
                <label class="form-group form-group--full">
                  <span class="form-label">确认新密码</span>
                  <input class="form-control" name="confirmPassword" type="password" maxlength="25" required />
                </label>
                <div class="form-group form-group--full">
                  <button class="btn btn-primary" type="submit">保存密码</button>
                </div>
              </form>
            </section>
            <section class="panel favorites-panel">
              <div class="panel__header"><h2>我的收藏</h2></div>
              <div class="panel__body favorites-list" data-favorites-list></div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
