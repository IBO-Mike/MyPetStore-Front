<!doctype html>
<html class="animal-cursor" lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyPetStore 启动页</title>
  </head>
  <body class="animal-cursor">
    <main class="startup-page animal-cursor" aria-label="MyPetStore 启动页">
      <div class="startup-pattern" aria-hidden="true"></div>
      <section class="startup-hero">
        <div class="startup-copy">
          <h1 class="startup-title">
            MyPet<br />
            Store <span>v1.0</span>
          </h1>
          <p class="startup-subtitle">
            治愈风格的 MyPetStore 前端，浏览商品、管理购物车和订单都更轻松温暖。
          </p>
          <a class="startup-action" href="/catalog.html" data-start-button>
            开始使用 <span aria-hidden="true">→</span>
          </a>
        </div>

        <div class="pet-scene" aria-hidden="true">
          <span class="pet-bubble pet-bubble--cats">Cats</span>
          <span class="pet-bubble pet-bubble--dogs">Dogs</span>
          <span class="pet-bubble pet-bubble--fish">Fish</span>
          <div class="animal-art"></div>
        </div>
      </section>
    </main>
  </body>
</html>
