<!doctype html>
<html class="animal-cursor" lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的订单 - MyPetStore</title>
  </head>
  <body class="animal-cursor">
    <div class="site-shell animal-cursor" data-app-shell>
      <main class="main">
        <div class="container">
          <div class="page-head">
            <div>
              <h1>我的订单</h1>
              <p data-order-meta>查看订单状态和历史记录。</p>
            </div>
            <div class="page-head__actions">
              <select class="form-control order-status" data-status>
                <option value="">全部状态</option>
                <option value="pending">pending</option>
                <option value="shipped">shipped</option>
                <option value="delivered">delivered</option>
              </select>
              <button class="btn btn-secondary" type="button" data-prev-page>上一页</button>
              <button class="btn btn-secondary" type="button" data-next-page>下一页</button>
            </div>
          </div>
          <div class="notice" data-notice></div>
          <section data-order-list></section>
        </div>
      </main>
    </div>
  </body>
</html>
