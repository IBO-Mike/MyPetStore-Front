<!doctype html>
<html class="animal-cursor" lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 - MyPetStore</title>
  </head>
  <body class="animal-cursor">
    <main class="cc-login animal-cursor" data-login-root>
      <section class="cc-left" aria-label="MyPetStore welcome panel">
        <a class="cc-brand" href="/">
          <span class="cc-brand__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 3.6c1.9 0 3.4 1.5 3.4 3.4v1.2h1.2c1.9 0 3.4 1.5 3.4 3.4s-1.5 3.4-3.4 3.4h-1.2v1.2c0 1.9-1.5 3.4-3.4 3.4s-3.4-1.5-3.4-3.4V15H7.4C5.5 15 4 13.5 4 11.6s1.5-3.4 3.4-3.4h1.2V7c0-1.9 1.5-3.4 3.4-3.4Z" />
            </svg>
          </span>
          <span>MyPetStore</span>
        </a>

        <div class="cc-stage" aria-hidden="true">
          <div class="cc-characters" data-characters>
            <div class="cc-character cc-character--purple" data-character="purple">
              <div class="cc-eye-group cc-eye-group--purple" data-eye-group="purple">
                <span class="cc-eye" data-eye data-eye-size="18" data-pupil-size="7" data-max-distance="5">
                  <span class="cc-pupil"></span>
                </span>
                <span class="cc-eye" data-eye data-eye-size="18" data-pupil-size="7" data-max-distance="5">
                  <span class="cc-pupil"></span>
                </span>
              </div>
            </div>

            <div class="cc-character cc-character--black" data-character="black">
              <div class="cc-eye-group cc-eye-group--black" data-eye-group="black">
                <span class="cc-eye" data-eye data-eye-size="16" data-pupil-size="6" data-max-distance="4">
                  <span class="cc-pupil"></span>
                </span>
                <span class="cc-eye" data-eye data-eye-size="16" data-pupil-size="6" data-max-distance="4">
                  <span class="cc-pupil"></span>
                </span>
              </div>
            </div>

            <div class="cc-character cc-character--orange" data-character="orange">
              <div class="cc-dot-group cc-dot-group--orange" data-eye-group="orange">
                <span class="cc-dot" data-dot data-dot-size="12" data-max-distance="5"></span>
                <span class="cc-dot" data-dot data-dot-size="12" data-max-distance="5"></span>
              </div>
            </div>

            <div class="cc-character cc-character--yellow" data-character="yellow">
              <div class="cc-dot-group cc-dot-group--yellow" data-eye-group="yellow">
                <span class="cc-dot" data-dot data-dot-size="12" data-max-distance="5"></span>
                <span class="cc-dot" data-dot data-dot-size="12" data-max-distance="5"></span>
              </div>
              <div class="cc-mouth" data-yellow-mouth></div>
            </div>
          </div>
        </div>

        <div class="cc-grid" aria-hidden="true"></div>
        <div class="cc-blob cc-blob--top" aria-hidden="true"></div>
        <div class="cc-blob cc-blob--bottom" aria-hidden="true"></div>
      </section>

      <section class="cc-right" aria-labelledby="login-title">
        <div class="cc-form-panel">
          <a class="cc-brand cc-brand--mobile" href="/">
            <span class="cc-brand__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M12 3.6c1.9 0 3.4 1.5 3.4 3.4v1.2h1.2c1.9 0 3.4 1.5 3.4 3.4s-1.5 3.4-3.4 3.4h-1.2v1.2c0 1.9-1.5 3.4-3.4 3.4s-3.4-1.5-3.4-3.4V15H7.4C5.5 15 4 13.5 4 11.6s1.5-3.4 3.4-3.4h1.2V7c0-1.9 1.5-3.4 3.4-3.4Z" />
              </svg>
            </span>
            <span>MyPetStore</span>
          </a>

          <div class="cc-heading">
            <p class="cc-kicker">WELCOME BACK</p>
            <h1 id="login-title">欢迎回来</h1>
            <p>请输入账户信息</p>
          </div>

          <form class="cc-form" data-login-form>
            <div class="cc-field">
              <label class="cc-label" for="login-email">用户名</label>
              <input
                id="login-email"
                class="cc-input"
                name="username"
                type="text"
                autocomplete="username"
                data-email-input
                required
              />
            </div>

            <div class="cc-field">
              <label class="cc-label" for="login-password">密码</label>
              <div class="cc-password">
                <input
                  id="login-password"
                  class="cc-input cc-input--password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  maxlength="25"
                  data-password-input
                  required
                />
                <button
                  class="cc-password__toggle"
                  type="button"
                  aria-label="显示密码"
                  aria-pressed="false"
                  data-password-toggle
                >
                  <svg class="cc-eye-icon cc-eye-icon--open" aria-hidden="true" viewBox="0 0 24 24">
                    <path
                      d="M2.8 12s3.2-5.2 9.2-5.2 9.2 5.2 9.2 5.2-3.2 5.2-9.2 5.2S2.8 12 2.8 12Z"
                      fill="none"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                    />
                    <circle cx="12" cy="12" r="2.8" fill="none" stroke="currentColor" stroke-width="2" />
                  </svg>
                  <svg class="cc-eye-icon cc-eye-icon--closed" aria-hidden="true" viewBox="0 0 24 24">
                    <path
                      d="m3 3 18 18M10.6 10.6A2 2 0 0 0 12 14a2 2 0 0 0 1.4-.6M9.9 5.1A9.7 9.7 0 0 1 12 4.8c6 0 9.2 5.2 9.2 5.2a14.7 14.7 0 0 1-3 3.4M6.8 6.8A14.7 14.7 0 0 0 2.8 12s3.2 5.2 9.2 5.2c1.6 0 3-.4 4.2-1"
                      fill="none"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <div class="cc-error" data-error-message role="alert"></div>
            <div class="notice cc-notice" data-notice role="status" aria-live="polite"></div>

            <button class="cc-button cc-button--login" type="submit">登录</button>
          </form>

          <p class="cc-signup">还没有账户？<a href="/register.html">前往注册</a></p>
        </div>
      </section>
    </main>
  </body>
</html>
