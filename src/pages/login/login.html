<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 - MyPetStore</title>
  </head>
  <body>
    <div class="site-shell" data-app-shell>
      <main class="main">
        <div class="container auth-page auth-page--single">
          <div class="notice" data-notice></div>
          <section class="panel">
            <div class="panel__header"><h1>登录</h1></div>
            <form class="panel__body form-grid" data-login-form>
              <label class="form-group form-group--full">
                <span class="form-label">用户名</span>
                <input class="form-control" name="username" autocomplete="username" required />
              </label>
              <label class="form-group form-group--full">
                <span class="form-label">密码</span>
                <input class="form-control" name="password" type="password" autocomplete="current-password" maxlength="25" required />
              </label>
              <div class="form-group form-group--full">
                <button class="btn btn-primary" type="submit">登录</button>
              </div>
              <p class="auth-page__switch form-group--full">
                还没有账户？<a href="/register.html">创建账户</a>
              </p>
            </form>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
