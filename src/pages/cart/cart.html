<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>购物车 - MyPetStore</title>
  </head>
  <body>
    <div class="site-shell" data-app-shell>
      <main class="main">
        <div class="container">
          <div class="page-head">
            <div>
              <h1>购物车</h1>
              <p data-cart-meta>查看并调整准备购买的商品。</p>
            </div>
            <button class="btn btn-primary" type="button" data-checkout>去结算</button>
          </div>
          <div class="notice" data-notice></div>
          <section data-cart-content></section>
        </div>
      </main>
    </div>
  </body>
</html>
