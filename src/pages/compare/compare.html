<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商品对比 - MyPetStore</title>
  </head>
  <body>
    <div class="site-shell" data-app-shell>
      <main class="main">
        <div class="container">
          <div class="page-head">
            <div>
              <h1>商品对比</h1>
              <p data-compare-meta>对比你感兴趣的商品，做出更好的选择。</p>
            </div>
            <button class="btn btn-outline" type="button" data-clear-compare>清空对比</button>
          </div>
          <div class="notice" data-notice></div>
          <section data-compare-content></section>
        </div>
      </main>
    </div>
  </body>
</html>
